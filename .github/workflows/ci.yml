name: CI

# Runs the full verification suite on every push and pull request. Nothing here
# needs a secret: the backend tests stub the LLM and verify Firebase tokens with
# a locally generated key pair, the frontend build uses the public Firebase web
# config already in the source, and the rules tests run against the emulator.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend + ML tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must be >= 3.11: scikit-learn 1.9 declares Requires-Python >=3.11,
          # and the committed artifact was fitted under it.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify the committed artifact loads
        # Fails loudly if the artifact cannot be unpickled under the pinned
        # dependency set, which is the failure mode a version bump would cause.
        run: |
          python -c "
          import joblib
          c = joblib.load('arogyaai_model.joblib')
          assert type(c['model']).__name__ == 'LogisticRegression', type(c['model']).__name__
          for k in ('model','scaler','vectorizer','encoders','feature_columns'):
              assert k in c, k
          print('artifact OK:', type(c['model']).__name__)
          "

      - name: Run backend and ML tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Production build
        run: npm run build

  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json

      - name: Set up Java
        # The Firestore emulator shells out to `java -version` and exits
        # immediately if it cannot find one. Its message ("Could not spawn")
        # does not say where it looked, so this step is not optional.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install rules test dependencies
        working-directory: tests/rules
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run rules tests against the emulator
        run: |
          firebase emulators:exec --only firestore --project arogyaai-cloud-ad667 \
            "cd tests/rules && npm test"
